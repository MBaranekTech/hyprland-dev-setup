# Personal overrides. Example:
# monitor = eDP-1, preferred, auto, 1.25
# This file is sourced last, so settings here override the defaults.

# Monitor layout saved by nwg-displays.
source = ~/.config/hypr/monitors.conf

# Wallpaper on all monitors.
exec-once = swaybg -i @HOME@/Pictures/wallpaper.png -m fill

# Auto-hiding application dock on the left edge.
exec-once = sh @HOME@/.config/hypr/scripts/dock.sh

# Frosted background for the dock, with transparent corners left clear.
decoration {
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}
windowrule = match:class .*, no_blur on
layerrule = match:namespace ^(nwg-dock)$, blur on, ignore_alpha 0.05

# Night light: automatic 18:00–08:00, with a toggle in Waybar.
exec-once = @HOME@/.local/bin/hyprsunset

# Drop-down terminal and notification center.
exec-once = @HOME@/.local/bin/pypr
bind = $mod, T, exec, @HOME@/.local/bin/pypr toggle terminal
bind = $mod, N, exec, swaync-client -t
