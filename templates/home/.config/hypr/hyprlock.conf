general {
    hide_cursor = true
}

background {
    monitor =
    path = @HOME@/Pictures/wallpaper.png
    blur_passes = 0
    color = rgb(202630)
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    outer_color = rgb(81a1c1)
    inner_color = rgb(2e3440)
    font_color = rgb(eceff4)
    font_family = DejaVu Sans
    placeholder_text = Heslo / Password
    fail_text = $PAMFAIL
    rounding = 5
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(eceff4)
    font_size = 64
    font_family = DejaVu Sans
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgb(d8dee9)
    font_size = 16
    position = 0, -125
    halign = center
    valign = center
}
