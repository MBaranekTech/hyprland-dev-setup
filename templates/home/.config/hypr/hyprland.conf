# Ubuntu 26.04 / Hyprland 0.53: development desktop.
$mod = SUPER
$terminal = foot --config=$HOME/.config/hypr/foot.ini
$menu = fuzzel --config=$HOME/.config/hypr/fuzzel.ini

monitor = , preferred, auto, 1

exec-once = sh ~/.config/hypr/scripts/session-start.sh

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(81a1c1)
    col.inactive_border = rgb(3b4252)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 5
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    animation = windows, 1, 2, default
    animation = workspaces, 1, 2, default
}

input {
    kb_layout = cz,us
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(202630)
    force_default_wallpaper = 0
}

bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, E, exec, nautilus --new-window
bind = $mod SHIFT, Q, killactive,
bind = $mod, F, fullscreen,
bind = $mod SHIFT, space, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = $mod, L, exec, loginctl lock-session
bind = $mod, V, exec, sh ~/.config/hypr/scripts/clipboard.sh
bind = $mod SHIFT, E, exec, sh ~/.config/hypr/scripts/power-menu.sh
bind = $mod SHIFT, R, exec, hyprctl reload
bind = , Print, exec, sh ~/.config/hypr/scripts/screenshot.sh

bind = $mod, Left, movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, Up, movefocus, u
bind = $mod, Down, movefocus, d
bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Right, movewindow, r
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Down, movewindow, d
binde = $mod CTRL, Left, resizeactive, -40 0
binde = $mod CTRL, Right, resizeactive, 40 0
binde = $mod CTRL, Up, resizeactive, 0 -40
binde = $mod CTRL, Down, resizeactive, 0 40
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Physical number row works with both Czech and US layouts.
bind = $mod, code:10, workspace, 1
bind = $mod, code:11, workspace, 2
bind = $mod, code:12, workspace, 3
bind = $mod, code:13, workspace, 4
bind = $mod, code:14, workspace, 5
bind = $mod, code:15, workspace, 6
bind = $mod, code:16, workspace, 7
bind = $mod, code:17, workspace, 8
bind = $mod, code:18, workspace, 9
bind = $mod SHIFT, code:10, movetoworkspace, 1
bind = $mod SHIFT, code:11, movetoworkspace, 2
bind = $mod SHIFT, code:12, movetoworkspace, 3
bind = $mod SHIFT, code:13, movetoworkspace, 4
bind = $mod SHIFT, code:14, movetoworkspace, 5
bind = $mod SHIFT, code:15, movetoworkspace, 6
bind = $mod SHIFT, code:16, movetoworkspace, 7
bind = $mod SHIFT, code:17, movetoworkspace, 8
bind = $mod SHIFT, code:18, movetoworkspace, 9
bind = $mod, Tab, workspace, previous
bind = $mod, grave, togglespecialworkspace, scratch
bind = $mod SHIFT, grave, movetoworkspace, special:scratch

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Personal overrides take precedence over defaults.
source = ~/.config/hypr/local.conf
