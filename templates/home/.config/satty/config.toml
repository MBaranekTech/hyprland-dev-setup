[general]
fullscreen = false
floating-hack = true
resize = { mode = "smart" }
initial-tool = "pointer"
copy-command = "wl-copy"
early-exit = []
actions-on-enter = ["save-to-clipboard", "save-to-file", "exit"]
actions-on-escape = ["exit"]
app-id = "org.satty.satty"
title = "Screenshot Editor"

[font]
family = "DejaVu Sans"
style = "Regular"
